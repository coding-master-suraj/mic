<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Wireless Mic Device</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at top,#17233d,#050812 55%,#020308);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.app{
width:100%;
max-width:650px;
}

.card{
background:rgba(13,19,35,.86);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:25px;
box-shadow:
0 25px 70px rgba(0,0,0,.55),
inset 0 1px rgba(255,255,255,.08);
backdrop-filter:blur(20px);
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:2px;
margin-bottom:5px;
}

.sub{
color:#8290aa;
font-size:13px;
margin-bottom:25px;
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:15px 0;
}

.label{
color:#8e9ab2;
font-size:13px;
}

.value{
font-weight:bold;
}

.status{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
background:#555;
box-shadow:0 0 10px #555;
}

.dot.green{
background:#00ff91;
box-shadow:0 0 18px #00ff91;
}

.dot.red{
background:#ff3155;
box-shadow:0 0 18px #ff3155;
}

input{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid #27334c;
background:#080d18;
color:white;
outline:none;
margin-bottom:12px;
}

button{
border:0;
border-radius:13px;
padding:13px 18px;
background:#17243b;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#223453;
}

.primary{
background:linear-gradient(
135deg,
#00d9ff,
#0066ff
);
}

.danger{
background:#571827;
}

.success{
background:#0b533b;
}

.hidden{
display:none!important;
}

.switch{
position:relative;
width:62px;
height:32px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#252d3c;
border-radius:50px;
cursor:pointer;
}

.slider:before{
content:"";
position:absolute;
width:24px;
height:24px;
left:4px;
top:4px;
background:white;
border-radius:50%;
transition:.25s;
}

.switch input:checked + .slider{
background:#00d98b;
box-shadow:0 0 20px rgba(0,255,150,.4);
}

.switch input:checked + .slider:before{
transform:translateX(30px);
}

canvas{
width:100%;
height:170px;
border-radius:18px;
background:#02050b;
border:1px solid rgba(255,255,255,.08);
margin-top:15px;
}

.message{
padding:13px;
border-radius:12px;
background:#10192b;
font-size:13px;
color:#aebbd1;
margin-top:15px;
}

.bigStatus{
font-size:18px;
font-weight:bold;
}

.range{
width:100%;
accent-color:#00d9ff;
}

@media(max-width:500px){

.card{
padding:18px;
border-radius:22px;
}

.logo{
font-size:21px;
}

canvas{
height:130px;
}

}

</style>
</head>

<body>

<div class="app">

<div class="card">

<div class="logo">
🎤 WIRELESS MIC
</div>

<div class="sub">
MIC INPUT DEVICE
</div>


<div id="registerBox">

<div class="label">
Device Name
</div>

<input
id="deviceName"
placeholder="My Mic Device"
>

<div class="label">
Gmail
</div>

<input
id="email"
type="email"
placeholder="your@gmail.com"
>

<button
class="primary"
style="width:100%"
onclick="registerDevice()"
>
REGISTER DEVICE
</button>

</div>


<div id="verifyBox"
class="hidden">

<div class="label">
Enter Gmail verification code
</div>

<input
id="verifyCode"
maxlength="6"
placeholder="6 digit code"
>

<button
class="primary"
style="width:100%"
onclick="verifyEmail()"
>
VERIFY GMAIL
</button>

</div>


<div id="deviceBox"
class="hidden">


<div class="row">

<div>

<div class="label">
DEVICE
</div>

<div
id="deviceNameView"
class="bigStatus"
>
-
</div>

</div>

<div class="status">

<span
id="onlineDot"
class="dot"
></span>

<span id="onlineText">
OFFLINE
</span>

</div>

</div>


<div class="row">

<div>

<div class="label">
REGISTRATION
</div>

<div id="approvalText">
WAITING
</div>

</div>

<div
id="approvalDot"
class="dot"
></div>

</div>


<div class="row">

<div>

<div class="label">
MIC INPUT
</div>

<div id="micText">
OFF
</div>

</div>


<label class="switch">

<input
id="micSwitch"
type="checkbox"
onchange="toggleMic()"
>

<span class="slider"></span>

</label>

</div>


<div class="row">

<div class="label">
INPUT GAIN
</div>

<div>
<span id="gainText">100%</span>
</div>

</div>

<input
id="gain"
class="range"
type="range"
min="0"
max="200"
value="100"
oninput="changeGain()"
>


<canvas
id="visualizer"
></canvas>


<div
id="message"
class="message"
>
Waiting for device approval...
</div>


</div>

</div>

</div>


<script>

/* =====================================================
   IMPORTANT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxG0tu6VMYbRuXEZ0Kb5-6YcucFC_AHqDdMGE72lyxIslTEey-JofLhrzgQ-UK33WrC/exec";


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
localStorage.getItem(
"wirelessMicDeviceId"
);

if(!deviceId){

deviceId =
crypto.randomUUID();

localStorage.setItem(
"wirelessMicDeviceId",
deviceId
);

}


let deviceToken =
localStorage.getItem(
"wirelessMicDeviceToken"
);


let statusData = null;

let localMicOn = false;

let peer = null;

let localStream = null;

let audioContext = null;

let sourceNode = null;

let gainNode = null;

let destinationNode = null;

let analyser = null;

let currentSession = null;

let handledAnswer = null;


/* =====================================================
   API
===================================================== */

async function api(
action,
data={}
){

const response =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({
action,
...data
})
}
);

return await response.json();

}


/* =====================================================
   REGISTER
===================================================== */

async function registerDevice(){

const name =
document.getElementById(
"deviceName"
).value.trim();

const email =
document.getElementById(
"email"
).value.trim();


if(!name || !email){

alert(
"Device name and Gmail required."
);

return;

}


try{

const r =
await api(
"registerDevice",
{
deviceId,
deviceName:name,
email
}
);


if(!r.ok){

throw new Error(
r.error
);

}


deviceToken =
r.deviceToken;

localStorage.setItem(
"wirelessMicDeviceToken",
deviceToken
);


document.getElementById(
"registerBox"
).classList.add(
"hidden"
);

document.getElementById(
"verifyBox"
).classList.remove(
"hidden"
);


showMessage(
"Verification code sent to Gmail."
);


}catch(e){

alert(e.message);

}

}


/* =====================================================
   VERIFY
===================================================== */

async function verifyEmail(){

const code =
document.getElementById(
"verifyCode"
).value.trim();


try{

const r =
await api(
"verifyEmail",
{
deviceId,
deviceToken,
code
}
);


if(!r.ok){

throw new Error(
r.error
);

}


document.getElementById(
"verifyBox"
).classList.add(
"hidden"
);

document.getElementById(
"deviceBox"
).classList.remove(
"hidden"
);


showMessage(
"Gmail verified. Waiting for admin approval."
);


loadStatus();


}catch(e){

alert(e.message);

}

}


/* =====================================================
   STATUS
===================================================== */

async function loadStatus(){

if(!deviceToken)
return;


try{

const r =
await api(
"deviceStatus",
{
deviceId,
deviceToken
}
);


if(!r.ok)
throw new Error(r.error);


statusData =
r.device;


updateUI();


}catch(e){

showMessage(
e.message
);

}

}


function updateUI(){

if(!statusData)
return;


document.getElementById(
"deviceNameView"
).textContent =
statusData.deviceName;


const onlineDot =
document.getElementById(
"onlineDot"
);

onlineDot.className =
"dot " +
(
statusData.online
?
"green"
:
"red"
);


document.getElementById(
"onlineText"
).textContent =
statusData.online
?
"ONLINE"
:
"OFFLINE";


const approved =
statusData.approved &&
!statusData.blocked;


const approvalDot =
document.getElementById(
"approvalDot"
);

approvalDot.className =
"dot " +
(
approved
?
"green"
:
"red"
);


if(statusData.blocked){

document.getElementById(
"approvalText"
).textContent =
"BLOCKED";

showMessage(
"Device is blocked by administrator."
);

stopMic();

return;

}


if(!statusData.verified){

document.getElementById(
"approvalText"
).textContent =
"EMAIL NOT VERIFIED";

return;

}


if(!statusData.approved){

document.getElementById(
"approvalText"
).textContent =
"WAITING FOR APPROVAL";

return;

}


document.getElementById(
"approvalText"
).textContent =
"APPROVED";


document.getElementById(
"micText"
).textContent =
localMicOn
?
"ON"
:
"OFF";


if(
statusData.controllerMicOn &&
localMicOn
){

showMessage(
"Controller connected. Starting microphone..."
);

}else{

showMessage(
"Approved. Turn MIC ON and wait for controller connection."
);

}

}


/* =====================================================
   LOCAL MIC
===================================================== */

async function toggleMic(){

localMicOn =
document.getElementById(
"micSwitch"
).checked;


if(
!statusData ||
!statusData.approved ||
statusData.blocked
){

document.getElementById(
"micSwitch"
).checked =
false;

localMicOn=false;

alert(
"Device must be approved first."
);

return;

}


try{

await api(
"deviceMicState",
{
deviceId,
deviceToken,
enabled:localMicOn
}
);


if(!localMicOn){

stopMic();

}else{

showMessage(
"MIC ON. Waiting for controller..."
);

checkConnection();

}

updateUI();


}catch(e){

alert(e.message);

}

}


/* =====================================================
   GAIN
===================================================== */

function changeGain(){

const value =
Number(
document.getElementById(
"gain"
).value
);


document.getElementById(
"gainText"
).textContent =
value + "%";


if(gainNode){

gainNode.gain.value =
value / 100;

}

}


/* =====================================================
   START MIC
===================================================== */

async function startMic(
signal
){

if(
peer ||
!localMicOn ||
!statusData ||
!statusData.approved ||
statusData.blocked ||
!statusData.controllerMicOn
){

return;

}


if(
signal.sessionId !==
currentSession
){

stopMic();

currentSession =
signal.sessionId;

}


try{

showMessage(
"Requesting microphone permission..."
);


localStream =
await navigator.mediaDevices
.getUserMedia({

audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:false,
channelCount:1
},

video:false

});


audioContext =
new AudioContext();


sourceNode =
audioContext
.createMediaStreamSource(
localStream
);


gainNode =
audioContext.createGain();


destinationNode =
audioContext
.createMediaStreamDestination();


analyser =
audioContext
.createAnalyser();

analyser.fftSize =
1024;


gainNode.gain.value =
Number(
document.getElementById(
"gain"
).value
) / 100;


sourceNode.connect(
gainNode
);

gainNode.connect(
analyser
);

gainNode.connect(
destinationNode
);


startVisualizer();


peer =
new RTCPeerConnection({

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

});


const tracks =
destinationNode
.stream
.getAudioTracks();


tracks.forEach(
track =>
peer.addTrack(
track,
destinationNode.stream
)
);


peer.onconnectionstatechange =
()=>{

if(!peer)
return;


const state =
peer.connectionState;


if(state === "connected"){

showMessage(
"🎤 LIVE — Voice is being sent to controller."
);

}


if(
state === "failed" ||
state === "disconnected"
){

showMessage(
"Connection lost. Reconnecting..."
);

}

};


const offer =
await peer.createOffer({

offerToReceiveAudio:false

});


await peer.setLocalDescription(
offer
);


await waitForICE(peer);


await api(
"setOffer",
{
deviceId,
deviceToken,
sessionId:
signal.sessionId,

offer:
peer.localDescription
}
);


showMessage(
"Waiting for controller audio connection..."
);


}catch(e){

console.error(e);

showMessage(
"Microphone error: " +
e.message
);

stopMic();

}

}


/* =====================================================
   ICE
===================================================== */

function waitForICE(
pc,
timeout=6000
){

if(
pc.iceGatheringState ===
"complete"
){

return Promise.resolve();

}


return new Promise(
resolve=>{

let done=false;


function finish(){

if(done)return;

done=true;

resolve();

}


pc.addEventListener(
"icegatheringstatechange",
()=>{

if(
pc.iceGatheringState ===
"complete"
){

finish();

}

}
);


setTimeout(
finish,
timeout
);

});

}


/* =====================================================
   SIGNAL POLLING
===================================================== */

async function checkConnection(){

if(!deviceToken)
return;


try{

const r =
await api(
"getSignal",
{
deviceId,
deviceToken,
role:"mic"
}
);


if(!r.ok)
return;


if(r.blocked){

stopMic();

return;

}


const signal =
r.signal;


if(!signal)
return;


if(
signal.state ===
"CLOSED"
){

stopMic();

currentSession=null;

return;

}


if(
signal.sessionId !==
currentSession
){

stopMic();

currentSession =
signal.sessionId;

handledAnswer=null;

}


if(
signal.state ===
"REQUESTED" &&
localMicOn &&
statusData &&
statusData.controllerMicOn &&
!peer
){

await startMic(
signal
);

return;

}


if(
signal.state ===
"ANSWER_READY" &&
signal.answer &&
peer &&
handledAnswer !==
signal.sessionId
){

handledAnswer =
signal.sessionId;


await peer.setRemoteDescription(
new RTCSessionDescription(
signal.answer
)
);


showMessage(
"🎤 LIVE AUDIO CONNECTED"
);

}

}catch(e){

console.log(e);

}

}


/* =====================================================
   STOP MIC
===================================================== */

function stopMic(){

if(peer){

try{
peer.close();
}catch(e){}

peer=null;

}


if(localStream){

localStream
.getTracks()
.forEach(
track =>
track.stop()
);

localStream=null;

}


if(audioContext){

try{
audioContext.close();
}catch(e){}

audioContext=null;

}


sourceNode=null;

gainNode=null;

destinationNode=null;

analyser=null;

currentSession=null;

handledAnswer=null;

}


/* =====================================================
   VISUALIZER
===================================================== */

function startVisualizer(){

drawVisualizer();

}


function drawVisualizer(){

const canvas =
document.getElementById(
"visualizer"
);

const ctx =
canvas.getContext("2d");


canvas.width =
canvas.clientWidth *
devicePixelRatio;

canvas.height =
canvas.clientHeight *
devicePixelRatio;

ctx.scale(
devicePixelRatio,
devicePixelRatio
);


const w =
canvas.clientWidth;

const h =
canvas.clientHeight;


function draw(){

requestAnimationFrame(draw);


ctx.clearRect(
0,0,w,h
);


ctx.strokeStyle =
"rgba(0,217,255,.18)";

ctx.beginPath();

ctx.moveTo(
0,
h/2
);

ctx.lineTo(
w,
h/2
);

ctx.stroke();


if(!analyser){

return;

}


const data =
new Uint8Array(
analyser.fftSize
);

analyser.getByteTimeDomainData(
data
);


drawLine(
data,
"#00eaff",
0
);

drawLine(
data,
"#ff28d7",
5
);

}


function drawLine(
data,
color,
offset
){

ctx.beginPath();

ctx.lineWidth=2;

ctx.strokeStyle=color;

for(
let i=0;
i<data.length;
i++
){

const x =
(i /
(data.length-1))
* w;

const y =
h/2 +
(
(data[i]-128)
/
128
) *
h*.38 +
offset;

if(i===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

}

ctx.stroke();

}


draw();

}


/* =====================================================
   HEARTBEAT
===================================================== */

async function heartbeat(){

if(!deviceToken)
return;


try{

const r =
await api(
"heartbeat",
{
deviceId,
deviceToken,
deviceMicOn:
localMicOn
}
);


if(r.ok){

statusData =
r.device;

updateUI();

}

}catch(e){

console.log(e);

}

}


/* =====================================================
   INIT
===================================================== */

async function init(){

if(!deviceToken)
return;


document.getElementById(
"registerBox"
).classList.add(
"hidden"
);

document.getElementById(
"deviceBox"
).classList.remove(
"hidden"
);


await loadStatus();

}


setInterval(
loadStatus,
3000
);


setInterval(
heartbeat,
5000
);


setInterval(
checkConnection,
1000
);


init();

</script>

</body>
</html>
