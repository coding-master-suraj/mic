<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Wireless Mic Input</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#06080d;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:min(600px,94%);
}

.card{
  background:
    linear-gradient(
      145deg,
      #111722,
      #080b12
    );

  border:1px solid #242b3a;

  border-radius:25px;

  padding:25px;

  box-shadow:
    0 20px 70px
    rgba(0,0,0,.5);
}

h1{
  margin-top:0;
}

input,
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin:6px 0;
  font-size:15px;
}

input{
  background:#171d2a;
  color:#fff;
}

button{
  background:#202b40;
  color:#fff;
  cursor:pointer;
}

.green{
  background:#087a4a;
}

.red{
  background:#8e1f2d;
}

.status{
  padding:15px;
  background:#0b1019;
  border-radius:15px;
  margin:15px 0;
}

.light{
  width:14px;
  height:14px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
  background:#555;
}

.live{
  background:#20ef8b;
  box-shadow:0 0 15px #20ef8b;
}

.blocked{
  background:#ff304f;
  box-shadow:0 0 15px #ff304f;
}

.visualizer{
  height:100px;
  margin:20px 0;
  display:flex;
  align-items:center;
  gap:3px;
}

.bar{
  flex:1;
  height:5px;
  background:#20ef8b;
  border-radius:10px;
  transition:.08s;
}

</style>

</head>

<body>

<div class="container">


<!-- ================================================
     REGISTRATION
================================================ -->

<div id="registerBox" class="card">

  <h1>🎙️ Wireless Mic</h1>

  <p>
    Register this device as a wireless microphone.
  </p>

  <input
    id="deviceName"
    placeholder="Device Name">

  <input
    id="gmail"
    type="email"
    placeholder="Gmail Address">

  <button
    class="green"
    onclick="registerDevice()">

    REGISTER DEVICE

  </button>

  <div id="registerMessage"></div>

</div>


<!-- ================================================
     OTP
================================================ -->

<div id="otpBox"
     class="card"
     style="display:none">

  <h2>📧 Gmail Verification</h2>

  <p>
    Verification code আপনার Gmail-এ পাঠানো হয়েছে।
  </p>

  <input
    id="otp"
    placeholder="6 Digit OTP"
    maxlength="6">

  <button
    class="green"
    onclick="verifyOtp()">

    VERIFY GMAIL

  </button>

  <div id="otpMessage"></div>

</div>


<!-- ================================================
     MIC
================================================ -->

<div id="micBox"
     class="card"
     style="display:none">

  <h1>🎙️ MIC INPUT</h1>

  <div class="status">

    <span
      id="light"
      class="light">
    </span>

    <span id="status">
      Waiting for approval
    </span>

  </div>


  <div>

    Device:
    <b id="deviceLabel"></b>

  </div>


  <div>

    ID:
    <b id="deviceIdLabel"></b>

  </div>


  <div class="visualizer"
       id="visualizer">
  </div>


  <button
    id="micButton"
    class="green"
    onclick="toggleMic()">

    🎙️ START MIC

  </button>


  <button
    onclick="location.reload()">

    🔄 REFRESH

  </button>

</div>

</div>


<script>

/* =====================================================
   GOOGLE SCRIPT
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbxG0tu6VMYbRuXEZ0Kb5-6YcucFC_AHqDdMGE72lyxIslTEey-JofLhrzgQ-UK33WrC/exec";


/* =====================================================
   STATE
===================================================== */

let deviceId = "";

let deviceName = "";

let gmail = "";

let micStream = null;

let peer = null;

let audioContext = null;

let source = null;

let analyser = null;

let localGain = null;

let running = false;

let lastOffer = "";


/* =====================================================
   JSONP
===================================================== */

function api(action,params={}){

  return new Promise((resolve,reject)=>{

    const callback =
      "cb_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random()*9999
      );


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams({

        action:action,

        callback:callback,

        ...params

      });


    window[callback] =
      data=>{

        resolve(data);

        script.remove();

        delete window[callback];

      };


    script.onerror=()=>{

      reject(
        new Error(
          "Server connection failed"
        )
      );

      script.remove();

      delete window[callback];

    };


    script.src =
      API +
      "?" +
      query.toString();


    document.body.appendChild(
      script
    );

  });

}


/* =====================================================
   DEVICE ID
===================================================== */

function createDeviceId(){

  let id =
    localStorage.getItem(
      "WIRELESS_MIC_DEVICE_ID"
    );


  if(!id){

    id =
      "MIC-" +
      Date.now().toString(36) +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();


    localStorage.setItem(
      "WIRELESS_MIC_DEVICE_ID",
      id
    );

  }


  return id;

}


deviceId =
  createDeviceId();


/* =====================================================
   INITIAL LOAD
===================================================== */

async function init(){

  deviceName =
    localStorage.getItem(
      "WIRELESS_MIC_DEVICE_NAME"
    ) || "";


  gmail =
    localStorage.getItem(
      "WIRELESS_MIC_GMAIL"
    ) || "";


  const r =
    await api("status",{
      deviceId:deviceId
    });


  if(r.ok){

    showMicBox(
      r
    );

  }

}


init();


/* =====================================================
   REGISTER
===================================================== */

async function registerDevice(){

  deviceName =
    document.getElementById(
      "deviceName"
    ).value.trim();


  gmail =
    document.getElementById(
      "gmail"
    ).value.trim();


  if(!deviceName){

    alert(
      "Device name দিন"
    );

    return;

  }


  if(!gmail){

    alert(
      "Gmail দিন"
    );

    return;

  }


  localStorage.setItem(
    "WIRELESS_MIC_DEVICE_NAME",
    deviceName
  );


  localStorage.setItem(
    "WIRELESS_MIC_GMAIL",
    gmail
  );


  const r =
    await api("register",{

      deviceId:deviceId,

      deviceName:deviceName,

      gmail:gmail,

      userAgent:
        navigator.userAgent

    });


  if(!r.ok){

    document.getElementById(
      "registerMessage"
    ).innerText =
      r.error;

    return;

  }


  const otp =
    await api("sendOtp",{

      deviceId:deviceId,

      gmail:gmail

    });


  if(!otp.ok){

    alert(
      otp.error
    );

    return;

  }


  document.getElementById(
    "registerBox"
  ).style.display="none";


  document.getElementById(
    "otpBox"
  ).style.display="block";

}


/* =====================================================
   VERIFY OTP
===================================================== */

async function verifyOtp(){

  const otp =
    document.getElementById(
      "otp"
    ).value.trim();


  const r =
    await api("verifyOtp",{

      deviceId:deviceId,

      otp:otp

    });


  if(!r.ok){

    document.getElementById(
      "otpMessage"
    ).innerText =
      r.error;

    return;

  }


  document.getElementById(
    "otpMessage"
  ).innerText =
    "Gmail verified. Waiting for admin approval...";


  setTimeout(
    checkStatus,
    1000
  );

}


/* =====================================================
   SHOW MIC BOX
===================================================== */

function showMicBox(data){

  document.getElementById(
    "registerBox"
  ).style.display="none";


  document.getElementById(
    "otpBox"
  ).style.display="none";


  document.getElementById(
    "micBox"
  ).style.display="block";


  document.getElementById(
    "deviceLabel"
  ).innerText =
    data.deviceName || deviceName;


  document.getElementById(
    "deviceIdLabel"
  ).innerText =
    deviceId;


  updateStatus(data);

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(data){

  const light =
    document.getElementById(
      "light"
    );


  const status =
    document.getElementById(
      "status"
    );


  if(data.status === "BLOCKED"){

    light.className =
      "light blocked";

    status.innerText =
      "🔴 DEVICE BLOCKED";

    stopMic();

    return;

  }


  if(data.status === "APPROVED"){

    light.className =
      "light live";

    status.innerText =
      data.mic === "ON"
        ? "🟢 MIC ON"
        : "🟢 APPROVED — MIC OFF";

    return;

  }


  light.className =
    "light";

  status.innerText =
    "🟠 WAITING FOR ADMIN APPROVAL";

}


/* =====================================================
   CHECK STATUS
===================================================== */

async function checkStatus(){

  const r =
    await api("status",{

      deviceId:deviceId

    });


  if(!r.ok){

    return;

  }


  if(
    document.getElementById(
      "micBox"
    ).style.display==="none"
  ){

    showMicBox(r);

  }else{

    updateStatus(r);

  }


  if(
    r.status === "APPROVED" &&
    r.mic === "ON" &&
    !running
  ){

    startMic();

  }


  if(
    r.mic === "OFF" &&
    running
  ){

    stopMic();

  }

}


/* =====================================================
   START MIC
===================================================== */

async function startMic(){

  if(running)return;


  try{

    micStream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false
        },

        video:false

      });


    audioContext =
      new AudioContext();


    source =
      audioContext
      .createMediaStreamSource(
        micStream
      );


    analyser =
      audioContext
      .createAnalyser();


    analyser.fftSize=128;


    localGain =
      audioContext
      .createGain();


    localGain.gain.value=1;


    source.connect(
      analyser
    );


    source.connect(
      localGain
    );


    createVisualizer();


    running=true;


    document.getElementById(
      "micButton"
    ).innerText =
      "🔴 STOP MIC";


    await createPeer();


  }catch(e){

    alert(
      "Microphone permission required: "
      + e.message
    );

  }

}


/* =====================================================
   STOP MIC
===================================================== */

function stopMic(){

  running=false;


  if(
    micStream
  ){

    micStream
      .getTracks()
      .forEach(
        t=>t.stop()
      );

  }


  if(peer){

    peer.close();

    peer=null;

  }


  if(audioContext){

    audioContext.close();

    audioContext=null;

  }


  micStream=null;


  const button =
    document.getElementById(
      "micButton"
    );


  if(button){

    button.innerText =
      "🎙️ START MIC";

  }

}


/* =====================================================
   TOGGLE
===================================================== */

function toggleMic(){

  if(running){

    stopMic();

  }else{

    startMic();

  }

}


/* =====================================================
   WEBRTC
===================================================== */

async function createPeer(){

  peer =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    });


  micStream
    .getTracks()
    .forEach(
      track=>{
        peer.addTrack(
          track,
          micStream
        );
      }
    );


  peer.onicecandidate =
    e=>{

      if(
        e.candidate
      ){

        sendICE(
          e.candidate
        );

      }

    };


  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  await waitForICE();


  await api("signal",{

    deviceId:deviceId,

    type:"offer",

    data:
      JSON.stringify(
        peer.localDescription
      )

  });


  waitForAnswer();

}


/* =====================================================
   WAIT ICE
===================================================== */

function waitForICE(){

  return new Promise(
    resolve=>{

      if(
        peer.iceGatheringState===
        "complete"
      ){

        resolve();

        return;

      }


      const fn=()=>{

        if(
          peer.iceGatheringState===
          "complete"
        ){

          peer.removeEventListener(
            "icegatheringstatechange",
            fn
          );

          resolve();

        }

      };


      peer.addEventListener(
        "icegatheringstatechange",
        fn
      );


      setTimeout(
        resolve,
        3000
      );

    }
  );

}


/* =====================================================
   ANSWER
===================================================== */

async function waitForAnswer(){

  for(let i=0;i<60;i++){

    if(!peer)return;


    const r =
      await api(
        "getSignal",
        {
          deviceId:deviceId
        }
      );


    if(
      r.ok &&
      r.answer
    ){

      try{

        await peer.setRemoteDescription(
          JSON.parse(r.answer)
        );

        return;

      }catch(e){

        console.log(e);

      }

    }


    await sleep(1000);

  }

}


/* =====================================================
   ICE
===================================================== */

async function sendICE(candidate){

  await api("signal",{

    deviceId:deviceId,

    type:"ice",

    data:
      JSON.stringify(candidate)

  });

}


/* =====================================================
   VISUALIZER
===================================================== */

function createVisualizer(){

  const box =
    document.getElementById(
      "visualizer"
    );


  box.innerHTML="";


  for(
    let i=0;
    i<40;
    i++
  ){

    const bar =
      document.createElement(
        "div"
      );

    bar.className="bar";

    box.appendChild(bar);

  }


  animateVisualizer();

}


function animateVisualizer(){

  if(!analyser)return;


  const data =
    new Uint8Array(
      analyser.frequencyBinCount
    );


  analyser.getByteFrequencyData(
    data
  );


  const bars =
    document.querySelectorAll(
      ".bar"
    );


  bars.forEach(
    (bar,i)=>{

      const value =
        data[
          i % data.length
        ] || 0;


      bar.style.height =
        Math.max(
          3,
          value / 2
        )+"px";

    }
  );


  requestAnimationFrame(
    animateVisualizer
  );

}


/* =====================================================
   HEARTBEAT
===================================================== */

async function heartbeat(){

  if(!deviceId)return;


  const r =
    await api(
      "heartbeat",
      {
        deviceId:deviceId
      }
    );


  if(!r.ok)return;


  updateStatus(r);


  if(
    r.status === "BLOCKED"
  ){

    stopMic();

    return;

  }


  if(
    r.status === "APPROVED" &&
    r.mic === "ON" &&
    !running
  ){

    startMic();

  }


  if(
    r.mic === "OFF" &&
    running
  ){

    stopMic();

  }

}


/* =====================================================
   POLLING
===================================================== */

setInterval(
  heartbeat,
  3000
);


setInterval(
  checkStatus,
  5000
);


/* =====================================================
   HELPER
===================================================== */

function sleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}

</script>

</body>
</html>
