<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Wireless Mic Input</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #17253b,
      #05070b 60%
    );
  color:#fff;
  font-family:Arial,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:min(600px,94%);
}

.card{
  background:
    linear-gradient(
      145deg,
      #121a28,
      #080b12
    );

  border:1px solid #263247;

  border-radius:25px;

  padding:25px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.5);
}

h1{
  margin-top:0;
}

input,
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  margin:6px 0;
  font-size:15px;
}

input{
  background:#171f2e;
  color:#fff;
}

button{
  background:#202d43;
  color:#fff;
  cursor:pointer;
}

.green{
  background:#087c4b;
}

.red{
  background:#8d1f30;
}

.status{
  padding:16px;
  border-radius:15px;
  background:#0a1019;
  margin:15px 0;
}

.light{
  width:13px;
  height:13px;
  border-radius:50%;
  display:inline-block;
  background:#555;
  margin-right:8px;
}

.greenLight{
  background:#20ed93;
  box-shadow:
    0 0 16px #20ed93;
}

.redLight{
  background:#ff3450;
  box-shadow:
    0 0 16px #ff3450;
}

.orangeLight{
  background:#ffbd3b;
  box-shadow:
    0 0 16px #ffbd3b;
}

.visualizer{
  height:120px;
  display:flex;
  align-items:center;
  gap:3px;
  margin:20px 0;
}

.bar{
  flex:1;
  min-height:4px;
  height:4px;
  border-radius:10px;
  background:#20ed93;
  transition:
    height .06s;
}

.timer{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}

</style>

</head>


<body>


<div class="container">


<!-- =================================================
     REGISTER
================================================== -->

<div
id="registerBox"
class="card">

  <h1>
    🎙️ WIRELESS MIC
  </h1>

  <p>
    Register this browser as a microphone device.
  </p>

  <input
    id="deviceName"
    placeholder="Device Name">

  <input
    id="gmail"
    type="email"
    placeholder="Gmail Address">

  <button
    class="green"
    onclick="registerDevice()">

    REGISTER DEVICE

  </button>

  <p id="registerMessage"></p>

</div>



<!-- =================================================
     OTP
================================================== -->

<div
id="otpBox"
class="card"
style="display:none">

  <h2>
    📧 Gmail Verification
  </h2>

  <p>
    আপনার Gmail-এ OTP পাঠানো হয়েছে।
  </p>

  <input
    id="otp"
    maxlength="6"
    placeholder="6 Digit OTP">

  <button
    class="green"
    onclick="verifyOtp()">

    VERIFY GMAIL

  </button>

  <p id="otpMessage"></p>

</div>



<!-- =================================================
     MIC PANEL
================================================== -->

<div
id="micBox"
class="card"
style="display:none">

  <h1>
    🎙️ MIC INPUT
  </h1>


  <div class="status">

    <span
      id="light"
      class="light">
    </span>

    <span id="status">
      Checking device...
    </span>

  </div>


  <p>
    Device:
    <b id="deviceNameLabel">
    </b>
  </p>


  <p>
    Device ID:
    <b id="deviceIdLabel">
    </b>
  </p>


  <div
    id="timer"
    class="timer">

    Timer: OFF

  </div>


  <!-- VISUALIZER -->

  <div
    id="visualizer"
    class="visualizer">
  </div>


  <button
    id="micButton"
    class="green"
    onclick="manualMic()">

    🎙️ START MICROPHONE

  </button>


  <button
    onclick="location.reload()">

    🔄 REFRESH

  </button>

</div>

</div>



<script>


/* =====================================================
   GOOGLE SCRIPT URL
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbxG0tu6VMYbRuXEZ0Kb5-6YcucFC_AHqDdMGE72lyxIslTEey-JofLhrzgQ-UK33WrC/exec";


/* =====================================================
   STATE
===================================================== */

let deviceId = "";

let deviceName = "";

let gmail = "";

let micStream = null;

let peer = null;

let audioContext = null;

let analyser = null;

let running = false;

let currentOffer = "";

let timerEnd = 0;


/* =====================================================
   CREATE DEVICE ID
===================================================== */

function getDeviceId(){

  let id =
    localStorage.getItem(
      "WIRELESS_MIC_DEVICE_ID"
    );


  if(!id){

    id =
      "MIC-" +
      Date.now()
        .toString(36)
        .toUpperCase() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();


    localStorage.setItem(
      "WIRELESS_MIC_DEVICE_ID",
      id
    );

  }


  return id;

}


deviceId =
  getDeviceId();


/* =====================================================
   API
===================================================== */

function api(
  action,
  params={}
){

  return new Promise(
    (resolve,reject)=>{

      const callback =
        "cb_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2,7);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams({

          action:action,

          callback:callback,

          ...params

        });


      window[callback] =
        data=>{

          resolve(data);

          script.remove();

          delete window[callback];

        };


      script.onerror =
        ()=>{

          reject(
            new Error(
              "Server connection failed"
            )
          );

          script.remove();

          delete window[callback];

        };


      script.src =
        API +
        "?" +
        query.toString();


      document.body.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   INITIAL
===================================================== */

async function init(){

  deviceName =
    localStorage.getItem(
      "WIRELESS_MIC_DEVICE_NAME"
    ) || "";


  gmail =
    localStorage.getItem(
      "WIRELESS_MIC_GMAIL"
    ) || "";


  const r =
    await api(
      "status",
      {
        deviceId:
          deviceId
      }
    );


  if(r.ok){

    showMicPanel(
      r
    );

  }

}


init();


/* =====================================================
   REGISTER
===================================================== */

async function registerDevice(){

  deviceName =
    document
      .getElementById(
        "deviceName"
      )
      .value
      .trim();


  gmail =
    document
      .getElementById(
        "gmail"
      )
      .value
      .trim();


  if(!deviceName){

    alert(
      "Device Name দিন."
    );

    return;

  }


  if(!gmail){

    alert(
      "Gmail দিন."
    );

    return;

  }


  localStorage.setItem(
    "WIRELESS_MIC_DEVICE_NAME",
    deviceName
  );


  localStorage.setItem(
    "WIRELESS_MIC_GMAIL",
    gmail
  );


  const r =
    await api(
      "register",
      {

        deviceId:
          deviceId,

        deviceName:
          deviceName,

        gmail:
          gmail,

        userAgent:
          navigator.userAgent

      }
    );


  if(!r.ok){

    alert(r.error);

    return;

  }


  const otp =
    await api(
      "sendOtp",
      {

        deviceId:
          deviceId,

        gmail:
          gmail

      }
    );


  if(!otp.ok){

    alert(
      otp.error
    );

    return;

  }


  document
    .getElementById(
      "registerBox"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "otpBox"
    )
    .style.display =
    "block";

}


/* =====================================================
   VERIFY OTP
===================================================== */

async function verifyOtp(){

  const otp =
    document
      .getElementById(
        "otp"
      )
      .value
      .trim();


  const r =
    await api(
      "verifyOtp",
      {

        deviceId:
          deviceId,

        otp:
          otp

      }
    );


  if(!r.ok){

    document
      .getElementById(
        "otpMessage"
      )
      .innerText =
      r.error;

    return;

  }


  document
    .getElementById(
      "otpMessage"
    )
    .innerText =
    "Gmail verified. Waiting for admin approval...";


  setTimeout(
    checkStatus,
    1000
  );

}


/* =====================================================
   SHOW PANEL
===================================================== */

function showMicPanel(data){

  document
    .getElementById(
      "registerBox"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "otpBox"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "micBox"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "deviceNameLabel"
    )
    .innerText =
    data.deviceName ||
    deviceName;


  document
    .getElementById(
      "deviceIdLabel"
    )
    .innerText =
    deviceId;


  updateStatus(
    data
  );

}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateStatus(data){

  const light =
    document
      .getElementById(
        "light"
      );


  const status =
    document
      .getElementById(
        "status"
      );


  if(
    data.status ===
    "BLOCKED"
  ){

    light.className =
      "light redLight";


    status.innerText =
      "🔴 DEVICE BLOCKED";


    stopMic();


    return;

  }


  if(
    data.status ===
    "APPROVED"
  ){

    light.className =
      "light greenLight";


    if(
      data.mic ===
      "ON"
    ){

      status.innerText =
        "🟢 MIC ON";

    }else{

      status.innerText =
        "🟢 APPROVED — MIC OFF";

    }


    return;

  }


  light.className =
    "light orangeLight";


  status.innerText =
    "🟠 WAITING FOR ADMIN APPROVAL";

}


/* =====================================================
   CHECK STATUS
===================================================== */

async function checkStatus(){

  const r =
    await api(
      "status",
      {

        deviceId:
          deviceId

      }
    );


  if(!r.ok){

    return;

  }


  if(
    document
      .getElementById(
        "micBox"
      )
      .style.display ===
    "none"
  ){

    showMicPanel(
      r
    );

  }else{

    updateStatus(
      r
    );

  }


  /* BLOCK */

  if(
    r.status ===
    "BLOCKED"
  ){

    stopMic();

    return;

  }


  /* ADMIN MIC ON */

  if(
    r.status ===
    "APPROVED" &&
    r.mic ===
    "ON" &&
    !running
  ){

    await startMic();

  }


  /* ADMIN MIC OFF */

  if(
    r.mic ===
    "OFF" &&
    running
  ){

    stopMic();

  }


  /* TIMER */

  updateTimer(
    r
  );


  /* WEBRTC OFFER */

  await checkOffer();

}


/* =====================================================
   START MIC
===================================================== */

async function startMic(){

  if(running){

    return;

  }


  try{

    micStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:
              false,

            noiseSuppression:
              false,

            autoGainControl:
              false

          },

          video:false

        });


    audioContext =
      new AudioContext();


    const localSource =
      audioContext
        .createMediaStreamSource(
          micStream
        );


    analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize =
      128;


    localSource.connect(
      analyser
    );


    createVisualizer();


    running =
      true;


    document
      .getElementById(
        "micButton"
      )
      .innerText =
      "🔴 MICROPHONE RUNNING";


    await waitForOfferAndAnswer();


  }
  catch(e){

    alert(
      "Microphone permission required.\n\n" +
      e.message
    );

  }

}


/* =====================================================
   STOP MIC
===================================================== */

function stopMic(){

  running =
    false;


  if(micStream){

    micStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if(peer){

    peer.close();

    peer =
      null;

  }


  if(audioContext){

    audioContext.close();

    audioContext =
      null;

  }


  micStream =
    null;


  const button =
    document
      .getElementById(
        "micButton"
      );


  if(button){

    button.innerText =
      "🎙️ START MICROPHONE";

  }

}


/* =====================================================
   MANUAL MIC
===================================================== */

async function manualMic(){

  const r =
    await api(
      "status",
      {
        deviceId:
          deviceId
      }
    );


  if(
    !r.ok
  ){

    return;

  }


  if(
    r.status !==
    "APPROVED"
  ){

    alert(
      "Admin approval required."
    );

    return;

  }


  if(running){

    stopMic();

  }else{

    await startMic();

  }

}


/* =====================================================
   WEBRTC
===================================================== */

async function waitForOfferAndAnswer(){

  for(
    let i=0;
    i<30;
    i++
  ){

    if(
      !running
    ){

      return;

    }


    const r =
      await api(
        "getSignal",
        {

          deviceId:
            deviceId

        }
      );


    if(
      r.ok &&
      r.offer
    ){

      if(
        r.offer !==
        currentOffer
      ){

        currentOffer =
          r.offer;


        await answerOffer(
          r.offer
        );


        return;

      }

    }


    await sleep(
      1000
    );

  }

}


/* =====================================================
   CHECK OFFER
===================================================== */

async function checkOffer(){

  if(!running){

    return;

  }


  const r =
    await api(
      "getSignal",
      {

        deviceId:
          deviceId

      }
    );


  if(
    r.ok &&
    r.offer &&
    r.offer !==
    currentOffer
  ){

    currentOffer =
      r.offer;


    await answerOffer(
      r.offer
    );

  }

}


/* =====================================================
   ANSWER OFFER
===================================================== */

async function answerOffer(
  offerData
){

  if(!micStream){

    return;

  }


  if(peer){

    peer.close();

  }


  peer =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    });


  micStream
    .getTracks()
    .forEach(
      track=>{

        peer.addTrack(
          track,
          micStream
        );

      }
    );


  await peer
    .setRemoteDescription(
      JSON.parse(
        offerData
      )
    );


  const answer =
    await peer
      .createAnswer();


  await peer
    .setLocalDescription(
      answer
    );


  await waitICE();


  await api(
    "signal",
    {

      deviceId:
        deviceId,

      type:
        "answer",

      data:
        JSON.stringify(
          peer.localDescription
        )

    }
  );

}


/* =====================================================
   WAIT ICE
===================================================== */

function waitICE(){

  return new Promise(
    resolve=>{

      if(
        !peer
      ){

        resolve();

        return;

      }


      if(
        peer.iceGatheringState ===
        "complete"
      ){

        resolve();

        return;

      }


      const check =
        ()=>{

          if(
            peer.iceGatheringState ===
            "complete"
          ){

            peer.removeEventListener(
              "icegatheringstatechange",
              check
            );


            resolve();

          }

        };


      peer.addEventListener(
        "icegatheringstatechange",
        check
      );


      setTimeout(
        resolve,
        5000
      );

    }
  );

}


/* =====================================================
   VISUALIZER
===================================================== */

function createVisualizer(){

  const box =
    document
      .getElementById(
        "visualizer"
      );


  box.innerHTML =
    "";


  for(
    let i=0;
    i<45;
    i++
  ){

    const bar =
      document.createElement(
        "div"
      );


    bar.className =
      "bar";


    box.appendChild(
      bar
    );

  }


  animateVisualizer();

}


/* =====================================================
   ANIMATE
===================================================== */

function animateVisualizer(){

  if(!analyser){

    return;

  }


  const data =
    new Uint8Array(
      analyser.frequencyBinCount
    );


  analyser
    .getByteFrequencyData(
      data
    );


  const bars =
    document
      .querySelectorAll(
        ".bar"
      );


  bars.forEach(
    (bar,i)=>{

      const value =
        data[
          i % data.length
        ] || 0;


      bar.style.height =
        Math.max(
          4,
          value / 1.7
        ) +
        "px";

    }
  );


  requestAnimationFrame(
    animateVisualizer
  );

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(data){

  const timer =
    document
      .getElementById(
        "timer"
      );


  if(
    !data.timerEnabled ||
    !data.timerMinutes
  ){

    timer.innerText =
      "Timer: OFF";

    return;

  }


  if(
    !data.timerStartedAt
  ){

    timer.innerText =
      "Timer: " +
      data.timerMinutes +
      " min";

    return;

  }


  const started =
    new Date(
      data.timerStartedAt
    ).getTime();


  const end =
    started +
    Number(
      data.timerMinutes
    ) *
    60000;


  const remaining =
    Math.max(
      0,
      end -
      Date.now()
    );


  if(
    remaining <= 0
  ){

    timer.innerText =
      "⏱️ TIMER FINISHED";


    if(running){

      stopMic();

    }


    return;

  }


  const totalSeconds =
    Math.floor(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  timer.innerText =
    "⏱️ " +
    minutes +
    ":" +
    String(seconds)
      .padStart(2,"0");

}


/* =====================================================
   HEARTBEAT
===================================================== */

async function heartbeat(){

  if(!deviceId){

    return;

  }


  const r =
    await api(
      "heartbeat",
      {

        deviceId:
          deviceId

      }
    );


  if(!r.ok){

    return;

  }


  updateStatus(
    r
  );


  if(
    r.status ===
    "BLOCKED"
  ){

    stopMic();

    return;

  }


  if(
    r.status ===
    "APPROVED" &&
    r.mic ===
    "ON" &&
    !running
  ){

    await startMic();

  }


  if(
    r.mic ===
    "OFF" &&
    running
  ){

    stopMic();

  }


  updateTimer(
    r
  );


  await checkOffer();

}


/* =====================================================
   SLEEP
===================================================== */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =====================================================
   POLLING
===================================================== */

setInterval(
  heartbeat,
  3000
);


setInterval(
  checkStatus,
  7000
);


async function checkStatus(){

  try{

    await checkStatusInternal();

  }
  catch(e){

    console.log(e);

  }

}


async function checkStatusInternal(){

  const r =
    await api(
      "status",
      {
        deviceId:
          deviceId
      }
    );


  if(!r.ok){

    return;

  }


  updateStatus(
    r
  );


  updateTimer(
    r
  );


  if(
    r.status ===
    "BLOCKED"
  ){

    stopMic();

    return;

  }


  if(
    r.status ===
    "APPROVED" &&
    r.mic ===
    "ON" &&
    !running
  ){

    await startMic();

  }


  if(
    r.mic ===
    "OFF" &&
    running
  ){

    stopMic();

  }


  await checkOffer();

}

</script>

</body>

</html>
